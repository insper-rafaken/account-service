# ─── ConfigMap ──────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: account-config
data:
  DATABASE_HOST: "account-db"
  DATABASE_PORT: "5432"
  DATABASE_DB: "store"
  DATABASE_USERNAME: "store"
---
# ─── PersistentVolumeClaim ──────────────────────────────────────────────────
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: account-db-pvc
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ebs-sc
  resources:
    requests:
      storage: 5Gi
---
# ─── PostgreSQL 17 Deployment ───────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: account-db
  labels:
    app: account-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: account-db
  template:
    metadata:
      labels:
        app: account-db
    spec:
      containers:
        - name: postgres
          image: postgres:17
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: "store"
            - name: POSTGRES_USER
              value: "store"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DATABASE_PASSWORD_ACCOUNT
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
          volumeMounts:
            - name: account-db-data
              mountPath: /var/lib/postgresql/data
              subPath: postgres
      volumes:
        - name: account-db-data
          persistentVolumeClaim:
            claimName: account-db-pvc
---
# ─── PostgreSQL 17 Service ──────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: account-db
spec:
  selector:
    app: account-db
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP
---
# ─── Account Deployment ─────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: account
  labels:
    app: account
spec:
  replicas: 1
  selector:
    matchLabels:
      app: account
  template:
    metadata:
      labels:
        app: account
    spec:
      containers:
        - name: account
          image: rafaelken/account:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: account-config
          env:
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DATABASE_PASSWORD_ACCOUNT
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
---
# ─── Account Service ────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: account
spec:
  selector:
    app: account
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
